[package]
name = "notify"
version = "0.1.0"
edition = "2021"
# Otherwise `cargo run -p notify` (what cargo-watch's dev loop uses) can't
# pick a default once a second binary (src/bin/send_test_push.rs) exists.
default-run = "notify"

[dependencies]
a2 = "0.10.0"
assets-rs = { path = "../../libs/assets-rs" }
base64 = "0.22.1"
env-rs = { path = "../../libs/env-rs" }
notify-contracts = { path = "../../libs/notify-contracts" }
bullmq-rs = "2.2.0"
chrono = "0.4"
jsonwebtoken = "11.1.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
resend-rs = "0.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
