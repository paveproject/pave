[package]
name = "api"
version = "0.1.0"
edition = "2021"


[dependencies]
async-trait = "0.1.92"
auth = { path = "../../libs/auth" }
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
bullmq-rs = "2.2.0"
chrono = "0.4"
dotenvy = "0.15"
notify-contracts = { path = "../../libs/notify-contracts" }
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", branch = "master", version = "1.0.0-alpha.3", default-features = false, features = ["axum", "seaorm2", "rustls"] }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
geohash = "0.13.2"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
futures-util = "0.3.34"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
