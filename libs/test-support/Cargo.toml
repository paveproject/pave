[package]
name = "test-support"
version = "0.1.0"
edition = "2021"

[dependencies]
# Same feature set as apps/api's own Cargo.toml - the admin connection this
# crate opens to DROP/CREATE DATABASE has to speak to the exact same
# Postgres driver stack a real test's `AppState` will use.
sea-orm = { version = "2.0.4", default-features = false, features = [
	"sqlx-postgres",
	"runtime-tokio-rustls",
	"macros",
] }
serde_json = "1.0.154"
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", features = [
	"postgres",
	"redis",
	"rustfs",
] }
tokio = { version = "1.53.3", features = ["process", "rt-multi-thread"] }
# Creating the public bucket a fresh RustFS testcontainer starts without -
# same client apps/api's own `build_s3_client` uses, so the bucket it
# creates is set up exactly how a real request would expect it.
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"

[dev-dependencies]
redis = { version = "1", features = ["tokio-comp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
