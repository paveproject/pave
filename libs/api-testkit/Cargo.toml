[package]
name = "api-testkit"
version = "0.1.0"
edition = "2021"

[dependencies]
api = { version = "0.1.0", path = "../../apps/api" }
async-trait = "0.1.92"
auth = { version = "0.1.0", path = "../auth" }
axum = "0.8.9"
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", branch = "master", version = "1.0.0-alpha.3", default-features = false, features = ["axum", "seaorm2", "rustls"] }
bullmq-rs = "2.2.0"
http-body-util = "0.1.5"
notify-contracts = { version = "0.1.0", path = "../notify-contracts" }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde_json = "1.0.151"
test-support = { version = "0.1.0", path = "../test-support" }
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
