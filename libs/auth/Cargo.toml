[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", branch = "master", version = "1.0.0-alpha.3", default-features = false, features = ["seaorm2", "rustls"] }
chrono = "0.4"
rand = "0.9"
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
validator = { version = "0.21.0", features = ["derive"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
