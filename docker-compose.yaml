services:
  db:
    build:
      context: .
      dockerfile: apps/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - ./tmp/db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    command: redis-server --appendonly yes
    volumes:
      - ./tmp/redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped
    ports:
      - '${TYPESENSE_PORT}:8108'
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    volumes:
      - ./tmp/typesense-data:/data
    command: >
      --data-dir /data
      --enable-cors

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.86
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-password123}
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - '${S3_PORT:-9900}:9000'
      - '${S3_CONSOLE_PORT:-9901}:9001'
    volumes:
      - ./tmp/rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-setup:
    image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-password123}
      S3_BUCKET: ${S3_BUCKET:-avatars}
      S3_IMPORTS_BUCKET: ${S3_IMPORTS_BUCKET:-imports}
    entrypoint: >
      /bin/sh -c "
      echo Waiting for RustFS...;
      rc alias set myrustfs http://rustfs:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY};

      rc bucket create --ignore-existing myrustfs/$${S3_BUCKET};
      rc bucket anonymous set download myrustfs/$${S3_BUCKET};
      echo Bucket $${S3_BUCKET} ready and set to public read.;

      rc bucket create --ignore-existing myrustfs/$${S3_IMPORTS_BUCKET};
      echo Bucket $${S3_IMPORTS_BUCKET} ready - private, no anonymous access.;
      "

  assets-sync:
    build:
      context: .
      dockerfile: libs/assets/Dockerfile
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-password123}
      S3_BUCKET: ${S3_BUCKET:-avatars}
      S3_ASSETS_PREFIX: static
    volumes:
      - ./libs/assets/static:/static:ro
