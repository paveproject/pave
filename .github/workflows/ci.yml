name: CI Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Nx's project graph fails to evaluate apps/mobile/app.config.ts under
  # Node's native TypeScript-stripping loader - `expo/config` resolves to a
  # directory import that loader's stricter ESM resolution rejects
  # (ERR_UNSUPPORTED_DIR_IMPORT). Falls back to swc/ts-node instead. Only
  # matters on a from-scratch install (local repeated runs reuse a graph
  # that was already computed before this ever broke), which is every CI
  # run - see https://nx.dev/docs/reference/environment-variables#nx-prefer-node-strip-types.
  NX_PREFER_NODE_STRIP_TYPES: 'false'

jobs:
  main:
    name: 🧪 Lint, Test & Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Skip for Release Please PRs
        if: ${{ startsWith(github.head_ref, 'release-please--branches') }}
        run: echo "Skipping CI for Release Please PRs."

      - name: ⬇️ Checkout Code
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Bun
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🔧 Setup Node.js
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🦀 Setup Rust
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # pkg-config + libssl-dev: openssl-sys is a transitive dependency
      # (see Cargo.lock) - same packages apps/api and apps/notify's
      # Dockerfiles install for their own `cargo build`.
      - name: 📦 Install system dependencies for Rust
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: 🗄️ Cache Cargo
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: Swatinem/rust-cache@v2

      - name: 🗄️ Cache Bun install
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: ⚙️ Install Dependencies
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        run: bun install --frozen-lockfile

      - name: 🧠 Initialize Nx SHAs
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        uses: nrwl/nx-set-shas@v5

      - name: 🧹 Run Lint (Affected)
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        run: bunx nx affected -t lint --parallel=3

      - name: 🧪 Run Tests (Affected)
        if: ${{ !startsWith(github.head_ref, 'release-please--branches') }}
        run: bunx nx affected -t test --parallel=3
