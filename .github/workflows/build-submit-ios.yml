name: Build and Submit iOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_fingerprint_save:
        description: 'Set by Mobile Router, which already saves fingerprints itself after all builds finish'
        type: boolean
        required: false
        default: false

jobs:
  build-ios:
    name: 🍏 Build & Submit iOS
    runs-on: macos-26
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v7

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 💾 Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🗄️ Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: ⚙️ Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔨 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.INFISICAL_EXPO_TOKEN }}

      - name: ⛏️ Setup EAS local builds
        run: bun add -g eas-cli-local-build-plugin

      - name: 📝 Prepare Environment Files
        run: |
          cat <<EOF > apps/mobile/.env
          APP_VARIANT=production
          EXPO_PUBLIC_API_URL="${{ secrets.INFISICAL_API_URL }}"
          EXPO_PUBLIC_WEB_APP="${{ secrets.INFISICAL_WEB_APP_URL }}"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_WEB_CLIENT_ID }}"
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_IOS_CLIENT_ID }}"
          EXPO_PUBLIC_MAPTILER_API_KEY="${{ secrets.INFISICAL_MAPTILER_API_KEY }}"
          EXPO_PUBLIC_SENTRY_DSN="${{ secrets.INFISICAL_SENTRY_DSN }}"
          SENTRY_AUTH_TOKEN="${{ secrets.INFISICAL_SENTRY_AUTH_TOKEN }}"
          SENTRY_ORG="${{ secrets.INFISICAL_SENTRY_ORG }}"
          SENTRY_PROJECT="${{ secrets.INFISICAL_SENTRY_PROJECT }}"
          # Not a secret, not from Infisical - flip here directly if a
          # different build target (e.g. a future web app) needs it.
          SENTRY_DISABLE_AUTO_UPLOAD=false
          EOF

      - name: 🔑 Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_IOS_BASE64: ${{ secrets.INFISICAL_GOOGLE_SERVICES_IOS_BASE64 }}
        run: |
          echo $GOOGLE_SERVICES_IOS_BASE64 | base64 --decode > apps/mobile/GoogleService-Info.plist

      - name: 🏗️ EAS Build (via Nx)
        timeout-minutes: 60
        env:
          GOOGLE_SERVICES_IOS_BASE64: ${{ secrets.INFISICAL_GOOGLE_SERVICES_IOS_BASE64 }}
        run: bunx nx build mobile --platform ios --profile production --local --non-interactive --output build.ipa

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-prod-run${{ github.run_number }}-${{ github.sha }}
          path: apps/mobile/build.ipa
          retention-days: 7

      - name: 🚀 EAS Submit (via Nx)
        run: bunx nx submit mobile --platform ios --path build.ipa --profile production --non-interactive --no-wait

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f apps/mobile/build.ipa
          rm -f apps/mobile/.env
          rm -f apps/mobile/GoogleService-Info.plist

  save-fingerprint:
    name: 💾 Save Fingerprint
    needs: build-ios
    # Skipped when Mobile Router calls this workflow: it already saves both
    # platforms' fingerprints itself in a single job, to avoid two parallel
    # Save Fingerprint runs racing to push to main. github.event_name can't
    # be used to detect that here (it's inherited from whatever triggered
    # the caller, not set to 'workflow_call'), so Mobile Router passes this
    # input explicitly instead.
    if: inputs.skip_fingerprint_save != true
    uses: ./.github/workflows/save-fingerprint.yml
    with:
      platform: ios
    secrets: inherit
