name: Build and Submit Android (EAS Cloud)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_fingerprint_save:
        description: 'Set by Mobile Router, which already saves fingerprints itself after all builds finish'
        type: boolean
        required: false
        default: false

env:
  # See ci.yml's env block for why this is needed on every from-scratch install.
  NX_PREFER_NODE_STRIP_TYPES: 'false'

jobs:
  build-android:
    name: 🤖 Build & Submit Android (EAS Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v7

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🗄️ Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: ⚙️ Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔨 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.INFISICAL_EXPO_TOKEN }}

      - name: 📝 Prepare Environment Files
        run: |
          cat <<EOF > apps/mobile/.env
          APP_VARIANT=production
          EXPO_PUBLIC_API_URL="${{ secrets.INFISICAL_API_URL }}"
          EXPO_PUBLIC_WEB_APP="${{ secrets.INFISICAL_WEB_APP_URL }}"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_WEB_CLIENT_ID }}"
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${{ secrets.INFISICAL_AUTH_GOOGLE_IOS_CLIENT_ID }}"
          EXPO_PUBLIC_MAPTILER_API_KEY="${{ secrets.INFISICAL_MAPTILER_API_KEY }}"
          EXPO_PUBLIC_SENTRY_DSN="${{ secrets.INFISICAL_SENTRY_DSN }}"
          SENTRY_AUTH_TOKEN="${{ secrets.INFISICAL_SENTRY_AUTH_TOKEN }}"
          SENTRY_ORG="${{ secrets.INFISICAL_SENTRY_ORG }}"
          SENTRY_PROJECT="${{ secrets.INFISICAL_SENTRY_PROJECT }}"
          # Not a secret, not from Infisical - flip here directly if a
          # different build target (e.g. a future web app) needs it.
          SENTRY_DISABLE_AUTO_UPLOAD=false
          EOF

      - name: 🔑 Decode google-services.json
        env:
          GOOGLE_SERVICES_ANDROID_BASE64: ${{ secrets.INFISICAL_GOOGLE_SERVICES_ANDROID_BASE64 }}
        run: |
          echo $GOOGLE_SERVICES_ANDROID_BASE64 | base64 --decode > apps/mobile/google-services.json

      - name: ☁️ EAS Build (via Nx, EAS Cloud)
        timeout-minutes: 300
        run: bunx nx build mobile --platform android --profile production --non-interactive

      - name: ✅ Verify Build Actually Finished
        working-directory: apps/mobile
        run: |
          # eas-cli resolves app.config.ts locally to read the project id, and
          # explicitly sets EXPO_NO_DOTENV=1 when it does so (it expects env
          # vars for that to come from EAS's own "environment" system on the
          # build server, not a local .env file) - see
          # node_modules/eas-cli/build/project/expoConfig.js. Since our
          # app.config.ts plugins read process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          # directly, and .env here is only ever a file (never exported), that
          # resolution fails with a missing-plugin-property error, and
          # eas-cli prints that failure - not JSON - to stdout, which is
          # what was actually breaking the jq parse below. Export .env's vars
          # into the real environment so eas-cli's local config resolution
          # has them, same as the EAS Cloud build server does for the actual
          # build.
          set -a
          source .env
          set +a
          STATUS=$(bunx eas build:list --platform android --build-profile production --limit 1 --non-interactive --json | jq -r '.[0].status')
          echo "Latest Android build status: $STATUS"
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::Android build did not finish (status: $STATUS) — failing this job so the self-hosted fallback can take over."
            exit 1
          fi

      - name: 🚀 EAS Submit (via Nx)
        run: bunx nx submit mobile --platform android --profile production --latest --non-interactive --no-wait

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f apps/mobile/.env
          rm -f apps/mobile/google-services.json

  save-fingerprint:
    name: 💾 Save Fingerprint
    needs: build-android
    # Skipped when Mobile Router calls this workflow: it already saves both
    # platforms' fingerprints itself in a single job, to avoid two parallel
    # Save Fingerprint runs racing to push to main. github.event_name can't
    # be used to detect that here (it's inherited from whatever triggered
    # the caller, not set to 'workflow_call'), so Mobile Router passes this
    # input explicitly instead.
    if: inputs.skip_fingerprint_save != true
    uses: ./.github/workflows/save-fingerprint.yml
    with:
      platform: android
    secrets: inherit
